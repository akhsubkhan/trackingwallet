name: Whale watch

on:
  schedule:
    # Tiap 15 menit, sengaja tidak di menit :00 (jam sibuk GitHub, delay lebih besar)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      token:
        description: "Opsional: alamat token untuk dikirimi narasi & info ke Telegram"
        required: false
        default: ""
      chain:
        description: "Chain token tersebut"
        type: choice
        options: [bsc, eth]
        default: bsc

concurrency:
  group: whale-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # State disimpan antar-run lewat cache (bukan commit ke repo). Daftar path jangan diubah:
      # path lain = cache baru, rekam jejak & data 24 jam bigbuy.py ikut hilang.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            bigbuy_state.json
          key: whale-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: whale-state-

      # Alert saldo whale (tracker.py) sengaja tidak dijadwalkan; jalankan manual bila perlu.
      # Wallet yang membeli token apa pun >= BIGBUY_MIN_USD di DEX BSC/ETH sejak run sebelumnya
      - name: Cek beli token besar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # BIGBUY_ARGS opsional, mis. "--smart-only" (hanya pembeli dengan rekam jejak bagus)
        # BIGBUY_TOP_MCAP: hanya N token market cap terbesar (0 = semua token, termasuk meme kecil)
        run: >-
          python3 bigbuy.py --once --min-usd "${{ vars.BIGBUY_MIN_USD || '10000' }}"
          --top-mcap "${{ vars.BIGBUY_TOP_MCAP || '50' }}" ${{ vars.BIGBUY_ARGS }}

      # Run manual dengan input token: kirim narasi & info token itu saja
      - name: Info token
        if: always() && github.event_name == 'workflow_dispatch' && inputs.token != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN: ${{ inputs.token }}
          CHAIN: ${{ inputs.chain }}
        run: python3 bigbuy.py --chains "$CHAIN" --info "$TOKEN"

      - name: Save state
        if: always() && hashFiles('state.json', 'bigbuy_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            bigbuy_state.json
          key: whale-state-${{ github.run_id }}-${{ github.run_attempt }}
